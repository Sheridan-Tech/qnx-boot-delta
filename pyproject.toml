[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qnx-boot-delta"
version = "0.1.0"
description = "Evidence-linked semantic review of QNX 8 startup-configuration changes"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
bootdelta = "bootdelta.__main__:main"

[tool.setuptools.packages.find]
include = ["bootdelta*"]

